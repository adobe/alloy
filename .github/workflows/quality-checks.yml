name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: "Quality checks"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        check:
          - build
          - lint
          - "format:check"
          - typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.check }}
  tests:
    name: "Tests"
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
        env:
          BUILD_NUMBER: $GITHUB_RUN_NUMBER
          BUILD_ID: $GITHUB_RUN_ID
          JOB_NUMBER: $GITHUB_JOB
      # @adobe/alloy-node's integration suite hits the Edge Network with an
      # OAuth Server-to-Server credential. It's separated into its own step
      # so it can skip (does not fail) when the secrets are not set (eg on
      # a fork's pull_request).
      - run: pnpm run test:node-integration
        env:
          CLIENT_ID: ${{ secrets.ALLOY_NODE_INTEGRATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ALLOY_NODE_INTEGRATION_CLIENT_SECRET }}
          SCOPES: ${{ secrets.ALLOY_NODE_INTEGRATION_SCOPES }}
          IMS_ORG_ID: ${{ secrets.ALLOY_NODE_INTEGRATION_IMS_ORG_ID }}
          DATASTREAM_ID: ${{ secrets.ALLOY_NODE_INTEGRATION_DATASTREAM_ID }}
